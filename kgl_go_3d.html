<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KGL GO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Arial Black','Arial',sans-serif}
canvas{display:block}

/* ─── START ─────────────────────────────────── */
#start{
  position:fixed;inset:0;z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.88);color:#fff;
}
#start h1{font-size:80px;font-weight:900;letter-spacing:-4px;line-height:1}
#start h1 span{color:#FFB830}
#start .tag{font-size:13px;letter-spacing:4px;opacity:.45;margin:10px 0 18px}
#start .desc{font-size:13px;opacity:.6;max-width:280px;text-align:center;line-height:1.7;margin-bottom:36px}
#start button{
  background:#FFB830;color:#0A0A0A;border:none;
  padding:16px 56px;font-size:17px;font-weight:900;
  border-radius:10px;cursor:pointer;letter-spacing:2px;
  pointer-events:all;
}
#start button:hover{background:#FFA500;transform:scale(1.03)}

/* ─── HUD ────────────────────────────────────── */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;display:none}

/* Speedo ring */
#speedo{
  position:absolute;bottom:28px;right:28px;
  width:114px;height:114px;border-radius:50%;
  background:rgba(5,5,15,.82);
  border:2px solid rgba(255,184,48,.6);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 0 24px rgba(255,184,48,.25),inset 0 0 20px rgba(255,184,48,.05);
}
#spd{font-size:34px;font-weight:900;color:#FFB830;line-height:1}
#spu{font-size:10px;color:rgba(255,184,48,.55);letter-spacing:3px;margin-top:3px}

/* Mission */
#mpanel{
  position:absolute;top:18px;left:50%;transform:translateX(-50%);
  background:rgba(5,5,15,.82);border:1px solid rgba(255,255,255,.12);
  border-radius:14px;padding:10px 24px;text-align:center;min-width:290px;color:#fff;
}
#mlabel{font-size:9px;letter-spacing:3px;opacity:.4;text-transform:uppercase}
#mtext{font-size:14px;margin-top:5px}
#mtip{font-size:22px;font-weight:900;color:#FFB830;margin-top:3px}

/* Progress dots */
#dots{position:absolute;top:18px;left:18px;display:flex;gap:7px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25)}
.dot.done{background:#00E5A0;border-color:#00E5A0}
.dot.now{background:#FFB830;border-color:#FFB830;box-shadow:0 0 8px #FFB830}

/* Camera btn */
#cambtn{
  position:absolute;top:18px;right:18px;pointer-events:all;
  background:rgba(5,5,15,.82);border:1px solid rgba(255,255,255,.18);
  color:#fff;padding:8px 14px;border-radius:8px;font-size:11px;
  cursor:pointer;letter-spacing:1px;
}
#cambtn:hover{background:rgba(255,255,255,.1)}

/* Hint */
#hint{
  position:absolute;bottom:28px;left:28px;
  color:rgba(255,255,255,.35);font-size:11px;line-height:1.9;
}

/* Crash flash */
#flash{position:absolute;inset:0;background:rgba(255,30,30,.42);opacity:0;pointer-events:none;transition:opacity .08s}

/* Speed-lines canvas (FP mode) */
#lines{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s}

/* Joystick */
#joy{position:absolute;bottom:22px;left:22px;width:130px;height:130px;display:none;pointer-events:all}
#jbase{width:130px;height:130px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);border-radius:50%;position:relative}
#jknob{width:54px;height:54px;background:rgba(255,184,48,.7);border:2px solid rgba(255,184,48,.9);border-radius:50%;position:absolute;top:38px;left:38px;pointer-events:none}
@media(max-width:768px){#joy{display:block}#hint{display:none}#speedo{bottom:170px}}
</style>
</head>
<body>

<div id="start">
  <h1>KGL <span>GO</span></h1>
  <div class="tag">NYAMIRAMBO · KIGALI</div>
  <div class="desc">Ride the streets. Pick up passengers.<br>Beat the clock. Own the city.</div>
  <button onclick="startGame()">TAP TO RIDE</button>
</div>

<div id="hud">
  <div id="dots"></div>
  <div id="mpanel">
    <div id="mlabel">MISSION</div>
    <div id="mtext">—</div>
    <div id="mtip">0 RWF</div>
  </div>
  <button id="cambtn" onclick="toggleCam()">👁 FIRST PERSON</button>
  <div id="speedo"><div id="spd">0</div><div id="spu">KM/H</div></div>
  <div id="flash"></div>
  <canvas id="lines"></canvas>
  <div id="hint">W / ↑ &nbsp;Accelerate<br>S / ↓ &nbsp;Brake<br>A D / ← → &nbsp;Steer<br>Space &nbsp;Handbrake<br>V &nbsp;Camera</div>
  <div id="joy"><div id="jbase"><div id="jknob"></div></div></div>
</div>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- Post-processing (bloom) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
//  COLOUR DESIGN  —  Kigali golden-hour palette
// ═══════════════════════════════════════════════════════════════
const C = {
  // sky
  sky_top : new THREE.Color(0x0B1240),
  sky_mid : new THREE.Color(0x6B2D8C),
  sky_hor : new THREE.Color(0xE84A10),
  sky_haze: new THREE.Color(0xFFAA40),
  sun     : new THREE.Color(0xFFE566),

  // ground / road
  ground  : 0xA8491E,
  road    : 0x141412,
  sidewalk: 0x706860,
  mark    : 0xF0EBD5,

  // buildings  —  flat-shaded, only 7 tones
  bldg: [ 0xD46040, 0xEEDDB0, 0x6A8FAD, 0x8DAA88, 0xC9A468, 0xF2EDE4, 0xBB5540 ],

  // vehicles (traffic)
  cars: [ 0x2255AA, 0xEEEEDD, 0xFF8800, 0x228833, 0xCC3333, 0x7744BB, 0x44AACC, 0xDDAA22 ],

  // moto
  paint : 0xCC1111,
  chrome: 0xCCCCCC,
  dark  : 0x111111,
  orange: 0xEE6600,
  yellow: 0xFFCC00,
};

// ═══════════════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════════════
function rnd(a,b){ return a + Math.random()*(b-a); }
function rndI(a,b){ return Math.floor(rnd(a,b+1)); }

function flatMat(hex){
  return new THREE.MeshToonMaterial({ color:hex, flatShading:true });
}
function stdMat(hex, roughness=0.55, metalness=0.1){
  return new THREE.MeshStandardMaterial({ color:hex, roughness, metalness, flatShading:true });
}

function box(w,h,d){ return new THREE.BoxGeometry(w,h,d); }
function cyl(rt,rb,h,s=12){ return new THREE.CylinderGeometry(rt,rb,h,s); }
function cone(r,h,s=8){ return new THREE.ConeGeometry(r,h,s); }
function tor(r,t,s=8,ss=32){ return new THREE.TorusGeometry(r,t,s,ss); }

function mesh(geo, mat, cast=true, recv=true){
  const m = new THREE.Mesh(geo,mat);
  m.castShadow=cast; m.receiveShadow=recv; return m;
}

function add(parent, geo, mat, x,y,z, rx=0,ry=0,rz=0, cast=true, recv=true){
  const m = mesh(geo,mat,cast,recv);
  m.position.set(x,y,z); m.rotation.set(rx,ry,rz);
  parent.add(m); return m;
}

// ═══════════════════════════════════════════════════════════════
//  SCENE + RENDERER
// ═══════════════════════════════════════════════════════════════
const scene = new THREE.Scene();
scene.fog   = new THREE.FogExp2(0xC86420, 0.0055); // warm sunset haze

const camera = new THREE.PerspectiveCamera(78, innerWidth/innerHeight, 0.1, 500);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.outputEncoding    = THREE.sRGBEncoding;
renderer.toneMapping       = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// ─── Post-processing (bloom) ──────────────────────────────────
let composer = null;
try {
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  const bloom = new THREE.UnrealBloomPass(
    new THREE.Vector2(innerWidth, innerHeight),
    0.55,   // strength
    0.55,   // radius
    0.82    // threshold
  );
  composer.addPass(bloom);
} catch(e){ composer = null; }  // fallback: render without bloom

// ─── Lights ───────────────────────────────────────────────────
// Sun — warm golden, low angle (golden hour)
const sun = new THREE.DirectionalLight(0xFFD070, 2.2);
sun.position.set(-80, 60, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
const sc = sun.shadow.camera;
Object.assign(sc,{near:.5,far:350,left:-160,right:160,top:160,bottom:-160});
sun.shadow.bias = -0.0006;
scene.add(sun);

// Rim light — cool blue from opposite side (gives pop to silhouettes)
const rim = new THREE.DirectionalLight(0x4488FF, 0.6);
rim.position.set(80, 40, -30);
scene.add(rim);

// Sky fill
scene.add(new THREE.HemisphereLight(0xFFAA44, 0xC1440E, 0.5));
scene.add(new THREE.AmbientLight(0xFF9944, 0.25));

// ═══════════════════════════════════════════════════════════════
//  SKY  —  gradient sphere + sun disc
// ═══════════════════════════════════════════════════════════════
const SKY_VERT = `
  varying vec3 vPos;
  void main(){ vPos=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }
`;
const SKY_FRAG = `
  varying vec3 vPos;
  uniform vec3 cTop,cMid,cHor,cHaze,cSun;
  uniform vec3 sunDir;
  void main(){
    vec3 n = normalize(vPos);
    float t = clamp(n.y, -0.08, 1.0);

    // 4-stop sky gradient
    vec3 sky;
    if(t>0.35)       sky = mix(cMid, cTop,  (t-0.35)/0.65);
    else if(t>0.05)  sky = mix(cHor, cMid,  (t-0.05)/0.30);
    else if(t>-0.04) sky = mix(cHaze, cHor, (t+0.04)/0.09);
    else             sky = cHaze;

    // Sun disc + glow
    float d = dot(n, normalize(sunDir));
    sky += cSun.rgb * smoothstep(0.997,1.0,d) * 3.0;
    sky += vec3(1.,.7,.3) * smoothstep(0.96,0.999,d) * 0.5 * max(0.,1.-t);

    gl_FragColor = vec4(sky,1.);
  }
`;

const skyMesh = new THREE.Mesh(
  new THREE.SphereGeometry(420, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      cTop: {value:C.sky_top},  cMid:{value:C.sky_mid},
      cHor: {value:C.sky_hor},  cHaze:{value:C.sky_haze},
      cSun: {value:C.sun},
      sunDir:{value: sun.position.clone().normalize()},
    },
    vertexShader: SKY_VERT, fragmentShader: SKY_FRAG,
  })
);
scene.add(skyMesh);

// Stylized cloud layers (flat discs at altitude)
const cloudMat = flatMat(0xFFEEDD);
cloudMat.transparent = true; cloudMat.opacity = 0.18;
[[120,90,-60],[−60,85,110],[40,95,80],[−120,88,−80]].forEach(([x,y,z])=>{
  const c = mesh(new THREE.CylinderGeometry(rnd(18,35),rnd(18,35),.8,8), cloudMat, false,false);
  c.position.set(x,y,z); c.rotation.x=.1*Math.random();
  scene.add(c);
});

// ═══════════════════════════════════════════════════════════════
//  WORLD  —  Ground, Roads, Buildings
// ═══════════════════════════════════════════════════════════════

// ─── Ground ────────────────────────────────────────────────────
const gMat = flatMat(C.ground);
const gnd  = mesh(new THREE.PlaneGeometry(700,700), gMat, false, true);
gnd.rotation.x = -Math.PI/2;
scene.add(gnd);

// ─── Road builder ──────────────────────────────────────────────
const rMat  = flatMat(C.road);
const swMat = flatMat(C.sidewalk);
const mMat  = flatMat(C.mark);
mMat.emissive = new THREE.Color(0xE0D8B0);
mMat.emissiveIntensity = 0.15;

function makeRoad(cx,cz,len,w,rotY=0){
  const g = new THREE.Group();
  // Asphalt slab
  const r = mesh(box(len,.09,w), rMat, false, true);
  r.position.y=.045; g.add(r);
  // Sidewalks
  [-1,1].forEach(s=>{
    const sw = mesh(box(len,.14,2), swMat, false, true);
    sw.position.set(0,.07,s*(w*.5+1)); g.add(sw);
  });
  // Dashes
  const dL=3.2, gap=4.5, tot=dL+gap, cnt=Math.floor(len/tot);
  for(let i=0;i<cnt;i++){
    const d = mesh(box(dL,.1,.18), mMat, false, false);
    d.position.set(-len/2+tot*i+dL/2+.5,.1,0); g.add(d);
  }
  // Edge lines
  [-(w*.5-.25),(w*.5-.25)].forEach(ez=>{
    const e = mesh(box(len,.1,.14), mMat, false, false);
    e.position.set(0,.1,ez); g.add(e);
  });
  g.position.set(cx,0,cz); g.rotation.y=rotY;
  scene.add(g);
}

function makeIsland(cx,cz,sz){
  const m = mesh(box(sz,.1,sz), rMat, false, true);
  m.position.set(cx,.05,cz); scene.add(m);
}

// ── Nyamirambo road network ──
makeRoad(  0,   0, 440,14);               // Avenue de la Paix (E-W)
makeRoad(  0,   0, 320,12,Math.PI/2);     // Rue Nyamirambo (N-S)
makeRoad( 45, -90, 300,11);               // Rue du Stade (E-W north)
makeRoad(-22,  92, 240, 9);               // Rue Biryogo (E-W south)
makeRoad(-130,-38, 170, 9,Math.PI/2);     // Muhima N-S
makeRoad( 130, 36, 170, 9,Math.PI/2);     // Kacyiru N-S
makeRoad( -55,-46, 130, 8);              // connector NW
makeRoad(  78, 50, 130, 8);              // connector SE

// Intersections
[[0,0,18],[0,-90,15],[0,92,13],[-130,0,13],[130,0,13],
 [45,-90,13],[-22,92,11],[-130,92,11],[130,-90,11]].forEach(([x,z,s])=>makeIsland(x,z,s));

// ─── Buildings ─────────────────────────────────────────────────
function placeBlock(xMin,xMax,zMin,zMax,count){
  for(let i=0;i<count;i++){
    const bw = rnd(10,24), bd = rnd(10,22), bh = rnd(8,40);
    const bx = rnd(xMin+bw/2, xMax-bw/2);
    const bz = rnd(zMin+bd/2, zMax-bd/2);
    const col = C.bldg[rndI(0,C.bldg.length-1)];
    const mat = flatMat(col);

    // Main block
    const body = mesh(box(bw,bh,bd), mat, true, true);
    body.position.set(bx,bh/2,bz);
    scene.add(body);

    // Slightly darker side panels (same mesh colour darkened)
    const darkCol = new THREE.Color(col).multiplyScalar(0.82);
    const sideMat = flatMat(darkCol.getHex());

    // Roof parapet
    const rph = rnd(0.6,1.8);
    const rp = mesh(box(bw+.3,rph,bd+.3), sideMat, true, false);
    rp.position.set(bx,bh+rph/2,bz);
    scene.add(rp);

    // Rooftop AC/water-tank box (Kigali aesthetic)
    if(Math.random()>.45){
      const tw=rnd(2,5), td=rnd(2,4), th=rnd(1.5,3.5);
      const t2 = mesh(box(tw,th,td), sideMat, true, false);
      t2.position.set(bx+rnd(-bw*.2,bw*.2), bh+rph+th/2, bz+rnd(-bd*.2,bd*.2));
      scene.add(t2);
    }

    // Stepped top on taller buildings
    if(bh>22 && Math.random()>.4){
      const sw2=bw*.6, sd2=bd*.6, sh2=rnd(4,8);
      const step = mesh(box(sw2,sh2,sd2), mat, true, false);
      step.position.set(bx,bh+rph+sh2/2,bz);
      scene.add(step);
    }

    // Window column (emissive strips = lit windows)
    const winMat = new THREE.MeshStandardMaterial({
      color:0x88AABB, emissive:new THREE.Color(0xFFEEBB), emissiveIntensity:.6,
      flatShading:true
    });
    const darkWin = flatMat(0x0A1520);
    const cols2 = Math.max(1,Math.floor(bw/5));
    const rows2 = Math.max(1,Math.floor(bh/5));
    for(let r=0;r<rows2;r++){
      for(let c=0;c<cols2;c++){
        if(Math.random()>.55) continue; // skip some windows
        const wx = bx - bw/2 + (c+.5)*(bw/cols2);
        const wy = 2.5 + r*(bh-3)/rows2;
        const wz = bz + bd/2 + .06;
        const wm = Math.random()>.35 ? winMat : darkWin;
        const wn = mesh(box(.9,1.2,.1), wm, false, false);
        wn.position.set(wx,wy,wz);
        scene.add(wn);
      }
    }
  }
}

// City blocks (safe from roads)
placeBlock(-210,-145,  10,  82,  7);
placeBlock(-122,  -9,  10,  82, 12);
placeBlock(   9, 120,  10,  82, 10);
placeBlock( 138, 210,  10,  82,  7);
placeBlock(-210,-145, -82, -10,  7);
placeBlock(-122,  -9, -82, -10, 10);
placeBlock(   9, 120, -82, -10,  9);
placeBlock( 138, 210, -82, -10,  7);
placeBlock(-210,-145,  84, 155,  5);
placeBlock( 138, 210, -98,-165,  5);
placeBlock(   9, 120, -98,-165,  6);
placeBlock(-122,  -9,  84, 155,  6);

// ─── Trees ─────────────────────────────────────────────────────
const trunkM = flatMat(0x3A2010);
const leaf1  = flatMat(0x1D5C20);
const leaf2  = flatMat(0x2A7A2A);

function placeTree(x,z){
  const g = new THREE.Group();
  const trunk = mesh(cyl(.2,.28,3,6), trunkM);
  trunk.position.y=1.5; g.add(trunk);
  // 3 stacked cones — indie-game tree
  [[2.8,5.5,0],[2.2,4,2],[1.5,3,3.8]].forEach(([r,h,y],i)=>{
    const lf = mesh(cone(r,h,7), i%2===0?leaf1:leaf2);
    lf.position.y=y; lf.rotation.y=Math.random()*Math.PI;
    g.add(lf);
  });
  g.position.set(x,0,z);
  scene.add(g);
}

for(let i=-9;i<=9;i++){ if(Math.abs(i)<2) continue; placeTree(i*22,-11); placeTree(i*22,11); }
for(let j=-7;j<=7;j++){ if(Math.abs(j)<2) continue; placeTree(-11,j*20); placeTree(11,j*20); }

// ─── Street Lights ─────────────────────────────────────────────
const poleMat  = flatMat(0x5A5A5A);
const globeMat = new THREE.MeshStandardMaterial({
  color:0xFFEE88, emissive:new THREE.Color(0xFFDD44), emissiveIntensity:2.0,
  flatShading:true
});

function placeLight(x,z){
  const g = new THREE.Group();
  add(g, cyl(.07,.1,7,8),  poleMat, 0,3.5,0);
  add(g, box(.08,.1,2.0),  poleMat, 0,7.1,1.0);
  add(g, new THREE.SphereGeometry(.28,8,6), globeMat, 0,6.8,2.0, 0,0,0, false,false);
  g.position.set(x,0,z); scene.add(g);
}

[-180,-110,-44,22,88,154].forEach(x=>{ placeLight(x,-12); placeLight(x,12); });
[-110,-60,-20,20,60,110].forEach(z=>{ placeLight(-12,z); placeLight(12,z); });

// ═══════════════════════════════════════════════════════════════
//  PLAYER MOTO  —  flat-shaded, designed proportions
// ═══════════════════════════════════════════════════════════════
const redP    = stdMat(C.paint,  .28, .42);
const chrP    = stdMat(C.chrome, .08, .92);
const darkP   = stdMat(C.dark,   .7,  .1);
const orgP    = stdMat(C.orange, .5,  .05);
const yelP    = stdMat(C.yellow, .3,  .1);

function buildMoto(){
  const g = new THREE.Group();

  // ── Chassis ──
  add(g,box(1.8,.42,.8),  darkP, 0,.21,0);   // lower
  add(g,box(1.5,.6,.76),  redP,  -.05,.72,0); // tank/body
  add(g,box(1.,.2,.7),   darkP, -.32,1.08,0); // seat
  add(g,box(.36,.54,.72), redP,  .80,.76,0);   // front fairing
  add(g,box(.5,.1,.82),   redP,  .80,.18,0);   // front mudguard
  add(g,box(.5,.1,.82),   redP, -.80,.18,0);   // rear mudguard

  // ── Handlebars + Fork ──
  const hb = mesh(cyl(.04,.04,1.,8), chrP);
  hb.rotation.z=Math.PI/2; hb.position.set(.72,1.1,0); g.add(hb);
  add(g,box(.09,.7,.09), chrP, .82,.55,0); // fork

  // ── Exhaust ──
  const ex = mesh(cyl(.06,.08,.9,8), chrP);
  ex.rotation.z=Math.PI/2; ex.position.set(-.45,.13,.38); g.add(ex);

  // ── Headlight (emissive) ──
  const hlM = new THREE.MeshStandardMaterial({
    color:0xFFFFCC, emissive:new THREE.Color(0xFFFF88), emissiveIntensity:3.0, flatShading:true
  });
  add(g,new THREE.SphereGeometry(.15,8,6), hlM, 1.02,.82,0, 0,0,0, false,false);

  // ── Tail light ──
  const tlM = new THREE.MeshStandardMaterial({
    color:0xFF2200, emissive:new THREE.Color(0xFF1100), emissiveIntensity:2.0, flatShading:true
  });
  add(g,box(.24,.1,.60), tlM, -.96,.9,0, 0,0,0, false,false);

  // ── Wheels ──
  const wGeo = cyl(.44,.44,.19,16);
  const rGeo = cyl(.26,.26,.21,12);
  const wMat = stdMat(C.dark,.8,.1);
  const rMat2 = stdMat(C.chrome,.08,.92);
  [.87,-.87].forEach(wx=>{
    const w=mesh(wGeo,wMat); w.rotation.z=Math.PI/2; w.position.set(wx,.44,0); g.add(w);
    const r=mesh(rGeo,rMat2); r.rotation.z=Math.PI/2; r.position.set(wx,.44,0); g.add(r);
  });

  // ── Rider ──
  add(g,box(.48,.7,.52), orgP, -.12,1.54,0);        // torso
  add(g,box(.58,.16,.18), orgP, .18,1.72,-.30);      // L arm
  add(g,box(.58,.16,.18), orgP, .18,1.72, .30);      // R arm
  add(g,box(.56,.16,.18), stdMat(0x223399,.7,.05), .14,1.07,-.27); // L leg
  add(g,box(.56,.16,.18), stdMat(0x223399,.7,.05), .14,1.07, .27); // R leg
  // Helmet
  const helm = mesh(new THREE.SphereGeometry(.27,10,8), yelP);
  helm.position.set(-.08,2.02,0); g.add(helm);
  // Visor
  add(g,box(.3,.13,.50), stdMat(0x336688,.1,.05), .14,2.,.0, 0,0,0, false,false);
  // Helmet chin
  add(g,box(.18,.1,.50), yelP, .16,1.84,.0);

  g.name='moto';
  return g;
}

const moto = buildMoto();
moto.position.set(10,0,2);
moto.rotation.y = Math.PI;
scene.add(moto);

// Wheel refs for spin animation
const motoWheels=[];
moto.traverse(c=>{
  if(c.isMesh && c.geometry.type==='CylinderGeometry' && c.geometry.parameters.radiusTop>.35)
    motoWheels.push(c);
});

// ═══════════════════════════════════════════════════════════════
//  TRAFFIC  —  stylized flat-shaded vehicles
// ═══════════════════════════════════════════════════════════════
function buildVehicle(col,type){
  const g  = new THREE.Group();
  const bm = flatMat(col);
  const wm = flatMat(C.dark);
  const gm = new THREE.MeshStandardMaterial({color:0x557799,transparent:true,opacity:.55,flatShading:true});

  if(type==='bus'){
    add(g,box(5.,.2,2.2),  flatMat(0xFFFFFF), 0,2.3,0);  // white roof stripe
    add(g,box(4.8,2.1,2.1), bm, 0,1.2,0);
    [-1.4,-.2,1.0].forEach(wz=>{ add(g,box(.08,.5,1.2),gm,.08,1.55,wz,0,0,0,false,false); });
  }else if(type==='suv'){
    add(g,box(4.4,1.25,2.0), bm, 0,.9,0);
    add(g,box(3.4,.85,1.88), bm, -.2,1.96,0);
    add(g,box(.08,.6,1.5),gm,-2.0,1.62,0,0,0,0,false,false);
  }else{
    add(g,box(4.,.98,1.82), bm, 0,.76,0);
    add(g,box(2.4,.76,1.72), bm, -.28,1.68,0);
    add(g,box(.08,.55,1.3),gm,-2.05,1.5,0,0,0,0,false,false);
  }

  // Wheels ×4
  [[ 1.35,-.88],[1.35,.88],[-1.35,-.88],[-1.35,.88]].forEach(([wx,wz])=>{
    const w=mesh(cyl(.38,.38,.22,12),wm); w.rotation.z=Math.PI/2; w.position.set(wx,.38,wz); g.add(w);
    const rr=mesh(cyl(.22,.22,.24,10),flatMat(0xAAAAAA)); rr.rotation.z=Math.PI/2; rr.position.set(wx,.38,wz); g.add(rr);
  });

  // Lights
  const hm=new THREE.MeshStandardMaterial({color:0xFFFFCC,emissive:new THREE.Color(0xFFFF88),emissiveIntensity:2.5,flatShading:true});
  const tm=new THREE.MeshStandardMaterial({color:0xFF2200,emissive:new THREE.Color(0xFF0000),emissiveIntensity:2.5,flatShading:true});
  add(g,box(.08,.2,.32), hm,  2.02,.88,-.55,0,0,0,false,false);
  add(g,box(.08,.2,.32), hm,  2.02,.88, .55,0,0,0,false,false);
  add(g,box(.08,.18,.28),tm, -2.02,.88,-.55,0,0,0,false,false);
  add(g,box(.08,.18,.28),tm, -2.02,.88, .55,0,0,0,false,false);

  return g;
}

const TDEFS=[
  {route:[[-215,0],[215,0]],  sp:.15, col:C.cars[0], type:'sedan', lane: 3.5},
  {route:[[215,0],[-215,0]],  sp:.12, col:C.cars[1], type:'bus',   lane:-3.5},
  {route:[[0,-155],[0,155]],  sp:.17, col:C.cars[2], type:'sedan', lane: 3.0},
  {route:[[0,155],[0,-155]],  sp:.14, col:C.cars[3], type:'suv',   lane:-3.0},
  {route:[[-140,-90],[180,-90]],sp:.13,col:C.cars[4],type:'bus',   lane: 3.2},
  {route:[[180,-90],[-140,-90]],sp:.11,col:C.cars[5],type:'sedan', lane:-3.2},
  {route:[[-120,92],[100,92]], sp:.16, col:C.cars[6], type:'sedan', lane: 3.0},
  {route:[[100,92],[-120,92]], sp:.10, col:C.cars[7], type:'suv',   lane:-3.0},
];

const traffic = TDEFS.map(d=>{
  const c=buildVehicle(d.col,d.type);
  c.position.set(d.route[0][0],0,d.route[0][1]);
  c.userData={...d,rIdx:0,t:0};

});

// ═══════════════════════════════════════════════════════════════
//  MISSION MARKERS  —  glowing beacon columns
// ═══════════════════════════════════════════════════════════════
const MISSIONS=[
  {pu:{x:35,z:-3,n:'Nyamirambo Market'},    do:{x:-60,z:-92,n:'Mosque Corner'},      tip:1500},
  {pu:{x:-75,z:4,n:'Biryogo Junction'},     do:{x:140,z:-3,n:'KBC Hill'},             tip:2000},
  {pu:{x:165,z:-92,n:'Stade Road East'},    do:{x:-95,z:94,n:'Muhima Junction'},      tip:1800},
  {pu:{x:-135,z:-58,n:'Muhima Road'},       do:{x:35,z:2,n:'Nyamirambo Market'},      tip:1600},
  {pu:{x:90,z:94,n:'Biryogo Heights'},      do:{x:-95,z:-92,n:'Stadium North'},       tip:2500},
  {pu:{x:-95,z:94,n:'Stadium South'},       do:{x:155,z:94,n:'KBC Heights'},          tip:3000},
];

function makeBeacon(col){
  const g = new THREE.Group();
  const em = new THREE.MeshStandardMaterial({color:col,emissive:new THREE.Color(col),emissiveIntensity:1.5,flatShading:true});

  // Ground ring
  const ring=mesh(tor(2.8,.24,8,40),em,false,false);
  ring.rotation.x=Math.PI/2; g.add(ring);
  // Pulsing outer ring
  const ring2=mesh(tor(3.8,.12,8,40),em,false,false);
  ring2.rotation.x=Math.PI/2; ring2.scale.setScalar(.7); g.add(ring2);
  // Vertical spike
  const spike=mesh(cyl(.1,.3,8,6),em,false,false);
  spike.position.y=4; g.add(spike);
  // Beacon top
  const top=mesh(new THREE.OctahedronGeometry(.6,0),em,false,false);
  top.position.y=8; g.add(top);
  // Store refs for animation
  g.userData.ring2=ring2; g.userData.top=top;
  return g;
}

let puMarker=null, doMarker=null;

function setMarkers(idx,phase){
  if(puMarker){scene.remove(puMarker);puMarker=null;}
  if(doMarker){scene.remove(doMarker);doMarker=null;}
  const m=MISSIONS[idx];
  if(phase==='PICKUP'){
    puMarker=makeBeacon(0x00FF88);
    puMarker.position.set(m.pu.x,0,m.pu.z);
    scene.add(puMarker);
    document.getElementById('mtext').textContent=`🏃 Pick up · ${m.pu.n}`;
  } else {
    doMarker=makeBeacon(0xFFB830);
    doMarker.position.set(m.do.x,0,m.do.z);
    scene.add(doMarker);
    document.getElementById('mtext').textContent=`📍 Drop off · ${m.do.n}`;
  }
}

// ═══════════════════════════════════════════════════════════════
//  SPEED LINES CANVAS  —  FP immersion
// ═══════════════════════════════════════════════════════════════
const linesCanvas = document.getElementById('lines');
const lCtx = linesCanvas.getContext('2d');
function resizeLines(){ linesCanvas.width=innerWidth; linesCanvas.height=innerHeight; }
resizeLines();

function drawSpeedLines(spd){
  linesCanvas.width = linesCanvas.width; // clear
  const cx=linesCanvas.width/2, cy=linesCanvas.height/2;
  const alpha = Math.min(1,(spd-.3)/.7) * .6;
  if(alpha<=0) return;
  lCtx.strokeStyle = `rgba(255,220,150,${alpha})`;
  for(let i=0;i<40;i++){
    const angle=Math.random()*Math.PI*2;
    const r0=Math.max(cx,cy)*.3;
    const r1=Math.max(cx,cy)*(1+Math.random()*.5);
    lCtx.lineWidth=Math.random()*1.5+.3;
    lCtx.beginPath();
    lCtx.moveTo(cx+Math.cos(angle)*r0, cy+Math.sin(angle)*r0);
    lCtx.lineTo(cx+Math.cos(angle)*r1, cy+Math.sin(angle)*r1);
    lCtx.stroke();
  }
}

// ═══════════════════════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════════════════════
let gameRunning=false, mIdx=0, phase='PICKUP';
let curTip=0, earned=0, crashCD=0;
let tipTimer=null, camMode='3rd';
let mSpeed=0;

// Camera smooth state
const c3Pos=new THREE.Vector3(), c3Look=new THREE.Vector3();

// Controls
const keys={};
document.addEventListener('keydown',e=>{keys[e.code]=true; if(e.code==='KeyV') toggleCam();});
document.addEventListener('keyup',e=>keys[e.code]=false);

// Joystick
let jActive=false,jX=0,jY=0;
const jBase=document.getElementById('jbase');
const jKnob=document.getElementById('jknob');
jBase.addEventListener('touchstart',e=>{jActive=true;e.preventDefault();},{passive:false});
jBase.addEventListener('touchend',()=>{jActive=false;jX=0;jY=0;jKnob.style.transform='';});
jBase.addEventListener('touchmove',e=>{
  e.preventDefault();
  const r=jBase.getBoundingClientRect();
  let dx=e.touches[0].clientX-(r.left+r.width/2);
  let dy=e.touches[0].clientY-(r.top+r.height/2);
  const d=Math.sqrt(dx*dx+dy*dy), J=38;
  if(d>J){dx=dx/d*J;dy=dy/d*J;}
  jX=dx/J;jY=dy/J;
  jKnob.style.transform=`translate(${dx}px,${dy}px)`;
},{passive:false});

// ─── Game functions ────────────────────────────────────────────
function startGame(){
  document.getElementById('start').style.display='none';
  document.getElementById('hud').style.display='block';
  gameRunning=true; mIdx=0; phase='PICKUP'; earned=0;
  buildDots(); setMarkers(0,'PICKUP'); curTip=MISSIONS[0].tip; updateHUD();
}

function toggleCam(){
  camMode = camMode==='3rd'?'1st':'3rd';
  document.getElementById('cambtn').textContent = camMode==='3rd'?'👁 FIRST PERSON':'🎥 THIRD PERSON';
  document.getElementById('lines').style.opacity = camMode==='1st'?'1':'0';
}

function buildDots(){
  const w=document.getElementById('dots'); w.innerHTML='';
  MISSIONS.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(i===0?' now':'');
    d.id=`d${i}`; w.appendChild(d);
  });
}
function refreshDots(){
  MISSIONS.forEach((_,i)=>{
    const d=document.getElementById(`d${i}`);
    if(d) d.className='dot'+(i<mIdx?' done':i===mIdx?' now':'');
  });
}
function updateHUD(){
  if(phase==='DROPOFF'){
    document.getElementById('mtip').textContent=curTip.toLocaleString()+' RWF ⏱';
    document.getElementById('mtip').style.color='#FFB830';
  } else {
    document.getElementById('mtip').textContent=earned.toLocaleString()+' RWF';
    document.getElementById('mtip').style.color='#00E5A0';
  }
}

// ─── Traffic update ────────────────────────────────────────────
function updateTraffic(dt){
  traffic.forEach(car=>{
    const d=car.userData, r=d.route;
    const from=r[d.rIdx%r.length], to=r[(d.rIdx+1)%r.length];
    const dx=to[0]-from[0], dz=to[1]-from[1];
    const len=Math.sqrt(dx*dx+dz*dz)||1;
    d.t += d.sp*dt/len;
    if(d.t>=1){d.t=0;d.rIdx=(d.rIdx+1)%r.length;return;}
    const cx=from[0]+dx*d.t, cz=from[1]+dz*d.t;
    car.position.set(cx+(-dz/len)*d.lane, 0, cz+(dx/len)*d.lane);
    car.rotation.y=Math.atan2(dx,dz);
  });
}

// ─── Mission + crash check ─────────────────────────────────────
function checkMission(){
  const m=MISSIONS[mIdx], px=moto.position.x, pz=moto.position.z, RAD=5.5;
  if(phase==='PICKUP'){
    if(Math.hypot(px-m.pu.x,pz-m.pu.z)<RAD){
      phase='DROPOFF'; curTip=m.tip;
      if(tipTimer)clearInterval(tipTimer);
      tipTimer=setInterval(()=>{curTip=Math.max(100,curTip-30);updateHUD();},1000);
      setMarkers(mIdx,'DROPOFF'); updateHUD();
    }
  } else {
    if(Math.hypot(px-m.do.x,pz-m.do.z)<RAD){
      earned+=curTip; if(tipTimer)clearInterval(tipTimer);
      mIdx++;
      if(mIdx>=MISSIONS.length){showWin();return;}
      phase='PICKUP'; refreshDots(); setMarkers(mIdx,'PICKUP');
      curTip=MISSIONS[mIdx].tip; updateHUD();
    }
  }
}

function checkCrash(){
  if(crashCD>0){crashCD--;return;}
  for(const c of traffic){
    if(Math.hypot(moto.position.x-c.position.x,moto.position.z-c.position.z)<3.8){
      mSpeed*=-.32;
      if(phase==='DROPOFF'){curTip=Math.max(100,curTip-200);updateHUD();}
      crashCD=70;
      const f=document.getElementById('flash');
      f.style.transition='opacity 0s';f.style.opacity=1;
      setTimeout(()=>{f.style.transition='opacity .25s';f.style.opacity=0;},80);
      break;
    }
  }
}

function showWin(){
  gameRunning=false;
  const w=document.createElement('div');
  w.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300;color:#fff;font-family:Arial Black,Arial,sans-serif;';
  w.innerHTML=`
    <div style="font-size:64px;margin-bottom:14px">🏆</div>
    <h2 style="font-size:40px;letter-spacing:-2px;margin-bottom:8px">Shift Complete!</h2>
    <p style="font-size:26px;color:#FFB830;margin-bottom:8px">${earned.toLocaleString()} RWF earned</p>
    <p style="opacity:.4;font-size:12px;letter-spacing:2px;margin-bottom:36px">STAGE 3: CARS · KLA · NBO · DAR</p>
    <button onclick="location.reload()" style="background:#FFB830;color:#000;border:none;padding:15px 48px;font-size:16px;font-weight:900;border-radius:10px;cursor:pointer;letter-spacing:2px;">RIDE AGAIN</button>
  `;
  document.body.appendChild(w);
}

// ═══════════════════════════════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════════════════════════════
const ACCEL=.018, MAX_SPD=.70, FRIC=.91, TURN=.034;

let lastT=null;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=lastT?Math.min((ts-lastT)/16.67,3):1; lastT=ts;

  if(!gameRunning){
    composer?composer.render():renderer.render(scene,camera);
    return;
  }

  const t=ts*.001;

  // ── Animate beacons ──
  const pulsate=(marker)=>{
    if(!marker) return;
    const tt = Math.sin(t*3)*.15;
    marker.position.y = tt;
    marker.rotation.y += .025*dt;
    if(marker.userData.top) marker.userData.top.rotation.y = t*2;
    if(marker.userData.ring2) marker.userData.ring2.scale.setScalar(.7+Math.sin(t*4)*.2);
  };
  pulsate(puMarker); pulsate(doMarker);

  // ── Input ──
  const fwd   = keys['KeyW']||keys['ArrowUp']    ||(jActive&&jY<-.2);
  const back  = keys['KeyS']||keys['ArrowDown']  ||(jActive&&jY>.2);
  const left  = keys['KeyA']||keys['ArrowLeft']  ||(jActive&&jX<-.2);
  const right = keys['KeyD']||keys['ArrowRight'] ||(jActive&&jX>.2);
  const brake = keys['Space'];

  mSpeed += (fwd?1:back?-.45:0) * ACCEL * dt;
  if(brake) mSpeed *= .72;
  mSpeed *= Math.pow(FRIC,dt);
  mSpeed = Math.max(-MAX_SPD*.35, Math.min(MAX_SPD,mSpeed));

  const sAbs=Math.abs(mSpeed);
  if(sAbs>.005) moto.rotation.y += (left?1:right?-1:0)*TURN*(sAbs/MAX_SPD)*dt;

  const dir=new THREE.Vector3(Math.sin(moto.rotation.y),0,Math.cos(moto.rotation.y));
  moto.position.addScaledVector(dir,mSpeed*dt);
  moto.position.y=0;

  // Wheel spin + lean
  motoWheels.forEach(w=>w.rotation.y+=mSpeed*2.8*dt);
  const targetLean=-(left?1:right?-1:0)*(sAbs/MAX_SPD)*.2;
  moto.rotation.z+=(targetLean-moto.rotation.z)*.1*dt;

  // ── Traffic + checks ──
  updateTraffic(dt);
  checkCrash();
  checkMission();

  // ── Speedo ──
  document.getElementById('spd').textContent = Math.round(sAbs*220);

  // ── FOV changes at speed ──
  camera.fov = 78 + sAbs*20;
  camera.updateProjectionMatrix();

  // ── Camera ──
  if(camMode==='3rd'){
    const dist=10+sAbs*12, ht=2.4+sAbs*3;
    const ideal=moto.position.clone().add(
      new THREE.Vector3(-dir.x*dist,ht,-dir.z*dist)
    );
    c3Pos.lerp(ideal,.08*dt);
    camera.position.copy(c3Pos);
    const look=moto.position.clone().addScaledVector(dir,7).add(new THREE.Vector3(0,1.2,0));
    c3Look.lerp(look,.1*dt);
    camera.lookAt(c3Look);
    camera.rotation.z = moto.rotation.z*.6; // subtle lean in 3rd person
  } else {
    // First-person: helmet POV
    const fpPos = moto.position.clone().add(
      new THREE.Vector3(-dir.x*.05, 1.92, -dir.z*.05)
    );
    camera.position.copy(fpPos);
    const fpLook = fpPos.clone().addScaledVector(dir,14).add(new THREE.Vector3(0,-.25,0));
    camera.lookAt(fpLook);
    camera.rotation.z = moto.rotation.z*1.6; // lean in helmet cam
    drawSpeedLines(sAbs/MAX_SPD);
  }

  // ── Render ──
  composer ? composer.render() : renderer.render(scene,camera);
}

// ── Resize ──
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  if(composer) composer.setSize(innerWidth,innerHeight);
  resizeLines();
});

requestAnimationFrame(loop);
</script>
